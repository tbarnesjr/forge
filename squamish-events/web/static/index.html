<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squamish Events</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <hgroup>
        <h1>
          <svg class="logo-icon" viewBox="0 0 40 32" width="40" height="32" aria-hidden="true">
            <path d="M20 2 L6 28 H34 Z" fill="var(--mountain-primary)" opacity="0.9"/>
            <path d="M30 8 L18 28 H38 Z" fill="var(--mountain-dark)" opacity="0.7"/>
            <path d="M20 2 L14 14 L20 10 L26 14 Z" fill="white" opacity="0.4"/>
          </svg>
          Squamish Events
        </h1>
        <p>Discover what's happening in Squamish</p>
      </hgroup>
    </div>
  </header>

  <main class="container">

    <!-- Toolbar: Search, Filters, View Toggle, Submit -->
    <section class="toolbar">
      <div class="toolbar-row">
        <div class="search-box">
          <input type="search" id="search-input" placeholder="Search events…" aria-label="Search events">
        </div>
        <div class="toolbar-actions">
          <div class="view-toggle" role="group">
            <button class="view-btn active" data-view="list" aria-label="List view" title="List view">
              <svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="2" width="16" height="3" rx="1"/><rect x="1" y="7.5" width="16" height="3" rx="1"/><rect x="1" y="13" width="16" height="3" rx="1"/></svg>
            </button>
            <button class="view-btn" data-view="calendar" aria-label="Calendar view" title="Calendar view">
              <svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="1" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="3" x2="6" y2="1" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="3" x2="12" y2="1" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>
          <button class="submit-btn" id="open-submit-btn">+ Submit Event</button>
        </div>
      </div>

      <div class="filters-row">
        <select id="category-filter" aria-label="Filter by category">
          <option value="">All Categories</option>
        </select>
        <select id="source-filter" aria-label="Filter by source">
          <option value="">All Sources</option>
        </select>
        <input type="date" id="date-from" aria-label="From date" title="From date">
        <input type="date" id="date-to" aria-label="To date" title="To date">
        <button class="clear-filters-btn" id="clear-filters-btn" type="button">Clear</button>
      </div>
    </section>

    <!-- Event List View -->
    <section id="event-list" class="event-list">
      <div id="events-container" class="events-grid"></div>
      <div id="load-more-wrap" class="load-more-wrap" hidden>
        <button id="load-more-btn" class="load-more-btn">Load More</button>
      </div>
      <p id="no-events" class="no-events" hidden>No events found.</p>
      <div id="list-loading" class="loading-indicator" hidden>
        <span aria-busy="true">Loading events…</span>
      </div>
    </section>

    <!-- Calendar View -->
    <section id="calendar-view" class="calendar-view" hidden>
      <div class="calendar-nav">
        <button id="cal-prev" aria-label="Previous month">&larr;</button>
        <h3 id="cal-title"></h3>
        <button id="cal-next" aria-label="Next month">&rarr;</button>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>

    <!-- Event Detail Overlay -->
    <dialog id="event-detail-dialog" class="event-detail-dialog">
      <article>
        <header>
          <button class="close-btn" aria-label="Close" data-close-detail>&times;</button>
          <h2 id="detail-title"></h2>
        </header>
        <div id="detail-body"></div>
      </article>
    </dialog>

    <!-- Submit Event Modal -->
    <dialog id="submit-dialog" class="submit-dialog">
      <article>
        <header>
          <button class="close-btn" aria-label="Close" id="close-submit-btn">&times;</button>
          <h2>Submit an Event</h2>
        </header>
        <form id="submit-form" novalidate>
          <label for="sub-title">Title *
            <input type="text" id="sub-title" name="title" required placeholder="Event title">
          </label>
          <label for="sub-description">Description *
            <textarea id="sub-description" name="description" required placeholder="Describe the event…" rows="3"></textarea>
          </label>
          <div class="form-row">
            <label for="sub-location">Location *
              <input type="text" id="sub-location" name="location" required placeholder="e.g. Brennan Park">
            </label>
            <label for="sub-category">Category *
              <select id="sub-category" name="category" required>
                <option value="">Select…</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label for="sub-start">Start *
              <input type="datetime-local" id="sub-start" name="start_time" required>
            </label>
            <label for="sub-end">End
              <input type="datetime-local" id="sub-end" name="end_time">
            </label>
          </div>
          <label for="sub-url">Event URL
            <input type="url" id="sub-url" name="url" placeholder="https://…">
          </label>
          <label for="sub-email">Contact Email *
            <input type="email" id="sub-email" name="contact_email" required placeholder="you@example.com">
          </label>
          <div id="submit-error" class="submit-error" hidden></div>
          <div id="submit-success" class="submit-success" hidden>
            Thanks! Your event has been submitted for review.
          </div>
          <footer>
            <button type="submit" id="submit-btn">Submit Event</button>
          </footer>
        </form>
      </article>
    </dialog>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Squamish Events &middot; Community-powered event listings</p>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
